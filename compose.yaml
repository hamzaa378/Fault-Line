services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faultline
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faultline-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline -d faultline"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://faultline:${POSTGRES_PASSWORD:-faultline-local-demo-only}@db:5432/faultline
      JWT_SECRET: ${JWT_SECRET:-faultline-unsafe-local-demo-secret-change-me}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-DemoPassword123!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
